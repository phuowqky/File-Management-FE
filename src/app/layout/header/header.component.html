<header class="header">
    <div class="header-left">
        <div class="menu-toggle">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <line x1="3" y1="12" x2="21" y2="12"></line>
                <line x1="3" y1="6" x2="21" y2="6"></line>
                <line x1="3" y1="18" x2="21" y2="18"></line>
            </svg>
        </div>
        <div class="search-bar">
            <div> <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
            </div>
            <div>
                <input type="text" placeholder="Search...">
            </div>
        </div>
    </div>
    <div class="header-right">
        <div class="notifications">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
                <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
            </svg>
            <span class="badge"></span>
        </div>
        <div class="user-profile" (click)="toggleDropdown()">
            <div>
                <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=Admin" alt="User Avatar">
            </div>
            <div>Admin</div>
            <div class="dropdown" [class.show]="isDropdownVisible">
                <button (click)="logout()">Đăng xuất</button>
            </div>
        </div>
    </div>
</header>
