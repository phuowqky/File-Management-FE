<div class="register-container">
    <div class="register-gif">
        <img src="assets/images/logoletter.png" class="register-gif">
    </div>
    <div class="register-card">
        <div class="register-header">
            <h1>Đăng ký</h1>
            <span>HỆ THỐNG TIẾP NHẬN THƯ BÁO</span>
        </div>
        <form class="register-form" [formGroup]="registerForm" (ngSubmit)="onSubmit()">
            <nz-form-item class="form-group">
                <nz-form-label>Tên đăng nhập</nz-form-label>
                <nz-form-control nzErrorTip="Vui lòng nhập tên đăng nhập">
                    <input nz-input formControlName="username" placeholder="Nhập tên đăng nhập" />
                </nz-form-control>
            </nz-form-item>
            <nz-form-item class="form-group">
                <nz-form-label>Mật khẩu</nz-form-label>
                <nz-form-control nzErrorTip="Vui lòng nhập mật khẩu">
                    <input nz-input type="password" formControlName="password" placeholder="Nhập mật khẩu" />
                </nz-form-control>
            </nz-form-item>

                        <nz-form-item class="form-group">
                <nz-form-label>Nhập lại mật khẩu</nz-form-label>
                <nz-form-control   [nzValidateStatus]="registerForm"
  nzErrorTip="Mật khẩu không khớp">
                    <input nz-input type="password" formControlName="confirmPassword" placeholder="Nhập lại mật khẩu" />
                </nz-form-control>
                
            </nz-form-item>
<ng-template #passwordError>
  <span *ngIf="registerForm.get('confirmPassword')?.hasError('required')">
    Vui lòng nhập lại mật khẩu
  </span>

  <span *ngIf="registerForm.hasError('mismatch')">
    Mật khẩu không khớp
  </span>
</ng-template>

            <button nz-button class="btn-register" type="submit">Đăng ký</button>

            <button nz-button class="btn-backlogin" type="button"(click)="goToLogin()">Quay lại đăng nhập</button>
        </form>


    </div>
</div>
