<div class="login-container">
    <div class="login-left">
        <img src="assets/images/pngegg.png" class="login-gif">
    </div>
    <div class="login-card">
        <div class="login-header">
            <h1>Đăng nhập</h1>
            <span>HỆ THỐNG TIẾP NHẬN PHẢN ÁNH</span>
        </div>
        <form class="login-form" [formGroup]="loginForm" (ngSubmit)="onSubmit()">
            <div class="form-group">
                <label for="username">Tên đăng nhập</label>
                <input type="text" id="username" placeholder="Nhập tên đăng nhập" formControlName="username"
                    [class.error]="loginForm.get('username')?.invalid && loginForm.get('username')?.touched" />

                <div class="error-message"
                    *ngIf="loginForm.get('username')?.invalid && loginForm.get('username')?.touched">
                    Vui lòng nhập tên đăng nhập
                </div>
            </div>
            <div class="form-group">
                <label for="password">Mật khẩu</label>
                <input type="password" id="password" placeholder="Nhập mật khẩu" formControlName="password"
                    [class.error]="loginForm.get('password')?.invalid && loginForm.get('password')?.touched" />

                            <div class="error-message" 
            *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched">
                Vui lòng nhập mật khẩu
            </div>
            </div>

            <button class="btn-login" type="submit">Đăng nhập</button>
        </form>
        <div class="divider">
            <span>Hoặc</span>
        </div>

        <button class="btn-google" type="button">
            <img src="assets/images/gg.svg" class="google-icon">
            Đăng nhập với Google
        </button>

    </div>
</div>
