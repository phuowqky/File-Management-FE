<div class="login-container">
    <div class="login-left">
        <img src="assets/images/logoletter.png" class="login-gif">
    </div>
    <div class="login-card">
        <div class="login-header">
            <h1>Đăng nhập</h1>
            <span>HỆ THỐNG TIẾP NHẬN THƯ BÁO</span>
        </div>
        <form class="login-form" [formGroup]="loginForm" (ngSubmit)="onSubmit()">
            <nz-form-item class="form-group">
                <nz-form-label>Tên đăng nhập</nz-form-label>
                <nz-form-control nzErrorTip="Vui lòng nhập tên đăng nhập">
                    <input nz-input formControlName="username" placeholder="Nhập tên đăng nhập" />
                </nz-form-control>
            </nz-form-item>
            <nz-form-item class="form-group">
                <nz-form-label>Mật khẩu</nz-form-label>
                <nz-form-control nzErrorTip="Vui lòng nhập mật khẩu">
                    <input nz-input type="password" formControlName="password" placeholder="Nhập mật khẩu" />
                </nz-form-control>
            </nz-form-item>

<nz-form-item>
  <label nz-checkbox formControlName="remember">
    Ghi nhớ đăng nhập
  </label>
</nz-form-item>
            <button nz-button class="btn-login" type="submit">Đăng nhập</button>
        </form>
        <div class="divider">
            <span>Hoặc</span>
        </div>

        <button class="btn-google" type="button">
            <img src="assets/images/gg.svg" class="google-icon">
            Đăng nhập với Google
        </button>

    </div>
</div>
