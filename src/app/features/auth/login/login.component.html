<div class="login-container">
    <div class="login-card">
        <div class="login-header">
            <h1>Welcome back</h1>
            <span>Login to your account</span>
        </div>

        <form class="login-form" [formGroup]="loginForm" (ngSubmit)="onSubmit()">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" placeholder="Enter your username" formControlName="username">
                <div class="error-message"
                    *ngIf="loginForm.get('username')?.invalid && loginForm.get('username')?.touched">
                    Username is required
                </div>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Enter your password" formControlName="password">
                <div class="error-message"
                    *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched">
                    Password is required
                </div>
            </div>
            <button class="btn-login" type="submit" [disabled]="loginForm.invalid">Login</button>
        </form>
    </div>
</div>
